# Opt in together with compose.workspaces.yaml. The worker gets document snapshots only
# over the private socket, not a project/data/key volume and never a Docker socket or shell.
services:
  workbench:
    environment:
      DEVA_TERMINAL_CONTROL_DIR: /run/deva-pty-control
    volumes:
      - terminal-control:/run/deva-pty-control:ro
  terminal-viewer:
    image: ${DEVA_TERMINAL_IMAGE:-deva-terminal-viewer:dev}
    build: { context: ., dockerfile: Dockerfile, target: terminal-viewer }
    platform: linux/amd64
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    network_mode: none
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    shm_size: 16m
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m']
    volumes:
      - terminal-control:/run/deva-pty-control
    command: [serve]
    healthcheck:
      test: [CMD, node, /opt/terminal-worker/src/cli.mjs, check]
      interval: 60s
      timeout: 8s
      retries: 2
    restart: unless-stopped
volumes:
  terminal-control: {}
