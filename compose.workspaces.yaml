# Optional: choose one dedicated directory whose direct children are approved projects.
# Owner-operated files, scoped notes, role defaults and optional conversation bindings only.
# No automatic model file access, Git history grant, or command execution.
services:
  workbench:
    environment:
      DEVA_WORKSPACE_ROOT: /workspaces
    volumes:
      - type: bind
        source: ${DEVA_WORKSPACE_PARENT:?Set the absolute path to your dedicated project collection}
        target: /workspaces
        read_only: true
        bind:
          create_host_path: false
