# PR 与推到 main 时做类型检查 + 构建，挡住编不过的改动。打包与发版仍由 release.yml 负责。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR 连续推送时取消上一次未跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 只做类型检查和 electron-vite 构建，用不到 Electron 二进制，跳过下载以加快安装
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm workbench:build

      - run: pnpm workbench:check

      - id: host_tests
        run: pnpm headless:test

      - name: Verify the actual native PTY and its private Unix protocol
        id: terminal_native
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' }}
        timeout-minutes: 4
        run: node --test --test-concurrency=1 apps/terminal-worker/test/*.test.mjs

      - name: Verify settings and chat in real sandboxed Chrome
        timeout-minutes: 4
        run: node scripts/workbench/e2e-browser.mjs

      - name: Verify profiles, roles and scoped memories in real sandboxed Chrome
        timeout-minutes: 5
        run: node scripts/workbench/e2e-library.mjs

      - name: Verify manual project file edits in real sandboxed Chrome
        timeout-minutes: 5
        run: node scripts/workbench/e2e-workspaces.mjs

      - name: Verify explicit file selection, send and private history previews in Chrome
        timeout-minutes: 5
        run: node scripts/workbench/e2e-attachments.mjs

      - name: Verify conversation preferences across two independent owner logins
        # Independent UI fixture: record its own outcome even if a previous Chrome workflow failed.
        # Other failed steps still fail the overall job.
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/workbench/e2e-sessions.mjs

      - name: Verify delivery cards, browser downloads and scoped file reveal
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/workbench/e2e-deliveries.mjs

      - name: Verify opt-in tracked Git inspection after repository packing
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/workbench/e2e-git-view.mjs

      - name: Verify session project binding across two owner browsers
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/workbench/e2e-session-workspaces.mjs

      - name: Verify native task inspection and a confirmed pause in Chrome
        id: task_ui
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEVA_QA_LAYOUT_CAPTURE: '1'
        run: node scripts/workbench/e2e-task-inspection.mjs

      - name: Publish verified task layouts from synthetic data only
        if: ${{ !cancelled() && steps.task_ui.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: task-workbench-layouts
          path: |
            test-results/task-inspection/tasks-wide.png
            test-results/task-inspection/tasks-compact.png
            test-results/task-inspection/layout.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify clipboard, quotes, local shortcuts and page fullscreen in real Chrome
        id: client_ui
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEVA_QA_CLIENT_CAPTURE: '1'
        run: node scripts/workbench/e2e-client-interactions.mjs

      - name: Publish the verified selection menu and quote draft from synthetic data
        if: ${{ !cancelled() && steps.client_ui.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: client-clipboard-and-quote
          path: |
            test-results/client-interactions/selection-menu.png
            test-results/client-interactions/quoted-draft.png
          if-no-files-found: error
          retention-days: 14

      - name: Verify a workspace file in the native PTY viewer through sandboxed Chrome
        id: terminal_ui
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' && steps.terminal_native.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEVA_QA_TERMINAL_CAPTURE: '1'
        run: node scripts/workbench/e2e-terminal-viewer.mjs

      - name: Publish the verified synthetic PTY screen
        if: ${{ !cancelled() && steps.terminal_ui.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-native-pty-viewer
          path: test-results/terminal-viewer/pty-screen.png
          if-no-files-found: error
          retention-days: 14

      - name: Verify the native skill library and owner preferences in two sandboxed Chrome logins
        id: skills_ui
        if: ${{ !cancelled() && steps.host_tests.outcome == 'success' }}
        timeout-minutes: 5
        env:
          DEVA_QA_SKILLS_CAPTURE: '1'
        run: node scripts/workbench/e2e-skill-library.mjs

      - name: Publish the verified synthetic skill settings and document views
        if: ${{ !cancelled() && steps.skills_ui.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-skill-library
          path: |
            test-results/skill-library/skills-list.png
            test-results/skill-library/skill-detail.png
          if-no-files-found: error
          retention-days: 14

      - name: Select the same installed Chrome for UI and worker
        run: bash scripts/workbench/ci-select-chromium.sh

      - name: Verify workbench UI controlling a second sandboxed browser
        timeout-minutes: 5
        run: node scripts/workbench/e2e-manual-browser.mjs

  packaged-session-workspaces:
    name: Packaged session workspace on native amd64 Docker
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/web-workbench-session-workspaces' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the actual amd64 workbench runtime
        timeout-minutes: 8
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 --target runtime -t deva-workbench:focus-verify .
      - name: Verify owner bindings across new containers and a removed grant
        timeout-minutes: 3
        run: node scripts/workbench/container-focus-ci.mjs

  packaged-tasks:
    name: Packaged native task management on amd64 Docker
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/web-workbench-task-inspection' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Build the production workbench image
        timeout-minutes: 8
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 --target runtime -t deva-workbench:tasks-verify .
          docker image inspect -f '{{.Os}}/{{.Architecture}} {{.Id}} {{.Size}} bytes' deva-workbench:tasks-verify
      - name: Inspect, preview and pause real task records through the packaged HTTP server
        timeout-minutes: 3
        run: |
          set -eu
          test -f "$PWD/apps/headless/test/task-inspection-http.test.mjs"
          docker run --rm --init --network none --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --cpus 2 --memory 512m --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=96m \
            --mount "type=bind,src=$PWD/apps/headless/test/task-inspection-http.test.mjs,dst=/opt/deva/apps/headless/ci/task-inspection.test.mjs,readonly" \
            --entrypoint node deva-workbench:tasks-verify --test /opt/deva/apps/headless/ci/task-inspection.test.mjs

  packaged-client:
    name: Sandboxed Chrome using the actual amd64 workbench image
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/web-workbench-client-interactions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the actual Linux amd64 runtime
        timeout-minutes: 8
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 --target runtime -t deva-workbench:client-verify .
      - name: Select the installed Chrome client
        run: bash scripts/workbench/ci-select-chromium.sh
      - name: Use the production CLI through a single loopback publication
        timeout-minutes: 5
        run: node scripts/workbench/container-client-interactions.mjs

  packaged-terminal:
    name: Native amd64 workbench and isolated PTY worker in Compose
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/web-workbench-terminal-viewer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build both production images on native amd64
        timeout-minutes: 9
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 --target runtime -t deva-workbench:terminal-verify .
          docker build --platform linux/amd64 --target terminal-viewer -t deva-terminal-viewer:verify .
      - name: Keep four genuine native viewers within the deployed worker limits
        timeout-minutes: 2
        run: |
          set -eu
          test -f "$PWD/apps/terminal-worker/verify/four-viewers.mjs"
          docker run --rm --init --network none --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 64 --cpus 1 --memory 128m --shm-size 16m \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m \
            --tmpfs /run/deva-pty-control:rw,nosuid,nodev,noexec,mode=0700,uid=1000,gid=1000,size=1m \
            --mount "type=bind,src=$PWD/apps/terminal-worker/verify/four-viewers.mjs,dst=/opt/terminal-worker/verify/four-viewers.mjs,readonly" \
            --entrypoint node deva-terminal-viewer:verify /opt/terminal-worker/verify/four-viewers.mjs
      - name: Select the installed sandboxed Chrome client
        run: bash scripts/workbench/ci-select-chromium.sh
      - name: Verify both live PTYs, kernel descriptors, owner UI and scoped teardown
        timeout-minutes: 6
        run: node scripts/workbench/container-terminal-viewer.mjs

  packaged-skills:
    name: Native skill preferences in the production amd64 workbench
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/web-workbench-skill-library' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the native Linux amd64 production image
        timeout-minutes: 8
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 --target runtime -t deva-workbench:skills-verify .
          docker image inspect -f '{{.Os}}/{{.Architecture}} {{.Id}} {{.Size}} bytes' deva-workbench:skills-verify
      - name: Verify skill management and model isolation inside the packaged host
        timeout-minutes: 3
        run: |
          set -eu
          test -f "$PWD/apps/headless/test/skill-library-http.test.mjs"
          docker run --rm --init --network none --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --cpus 2 --memory 512m --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=96m \
            --mount "type=bind,src=$PWD/apps/headless/test/skill-library-http.test.mjs,dst=/opt/deva/apps/headless/ci/skill-library-http.test.mjs,readonly" \
            --entrypoint node deva-workbench:skills-verify --test /opt/deva/apps/headless/ci/skill-library-http.test.mjs
      - name: Confirm real saved skill preferences across two distinct production containers
        timeout-minutes: 3
        run: node scripts/workbench/container-skill-library.mjs

  sandbox:
    name: Private human browser worker
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify worker protocols, egress and owner leases
        run: node --test --test-concurrency=1 apps/browser-worker/test/*.test.mjs test/browser-handoff.test.mjs
      - name: Select the installed browser for pipe-based verification
        run: bash scripts/workbench/ci-select-chromium.sh
      - name: Exercise a real sandboxed worker, handoff and shutdown
        run: node apps/browser-worker/test-real/engine-handoff.mjs
