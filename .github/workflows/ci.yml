# PR 与推到 main 时做类型检查 + 构建，挡住编不过的改动。打包与发版仍由 release.yml 负责。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR 连续推送时取消上一次未跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 只做类型检查和 electron-vite 构建，用不到 Electron 二进制，跳过下载以加快安装
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm workbench:build

      - run: pnpm workbench:check

      - run: pnpm headless:test

      - name: Verify settings and chat in real sandboxed Chrome
        timeout-minutes: 4
        run: node scripts/workbench/e2e-browser.mjs

      - name: Verify profiles, roles and scoped memories in real sandboxed Chrome
        timeout-minutes: 5
        run: node scripts/workbench/e2e-library.mjs

      - name: Verify manual project file edits in real sandboxed Chrome
        timeout-minutes: 5
        run: node scripts/workbench/e2e-workspaces.mjs

      - name: Verify explicit file selection, send and private history previews in Chrome
        timeout-minutes: 5
        run: node scripts/workbench/e2e-attachments.mjs

      - name: Select the same installed Chrome for UI and worker
        run: bash scripts/workbench/ci-select-chromium.sh

      - name: Verify workbench UI controlling a second sandboxed browser
        timeout-minutes: 5
        run: node scripts/workbench/e2e-manual-browser.mjs

  sandbox:
    name: Private human browser worker
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify worker protocols, egress and owner leases
        run: node --test --test-concurrency=1 apps/browser-worker/test/*.test.mjs test/browser-handoff.test.mjs
      - name: Select the installed browser for pipe-based verification
        run: bash scripts/workbench/ci-select-chromium.sh
      - name: Exercise a real sandboxed worker, handoff and shutdown
        id: handoff
        run: node apps/browser-worker/test-real/engine-handoff.mjs
      - name: Distinguish local document navigation failures on real Chrome
        if: ${{ failure() && steps.handoff.outcome == 'failure' }}
        timeout-minutes: 4
        run: node apps/browser-worker/test-real/engine-navigation-matrix.mjs

  packaged-browser:
    name: Packaged Chromium on native amd64 Docker
    # Measure the actual optional image on its own draft; downstream workbench PRs already
    # exercise the ordinary browser client and do not need to download Chromium at every push.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/web-workbench-browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Build the production Debian Chromium worker
        timeout-minutes: 8
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 -f apps/browser-worker/Dockerfile --target browser -t deva-browser-worker:verify .
          docker image inspect -f '{{.Os}}/{{.Architecture}} {{.Id}} {{.Size}} bytes' deva-browser-worker:verify
      - name: Verify the image with its actual non-root, capability-free sandbox
        timeout-minutes: 3
        run: |
          set -eu
          test -f "$PWD/apps/browser-worker/test-real/engine-handoff.mjs"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --user 1000:1000 --entrypoint /usr/bin/chromium deva-browser-worker:verify --version
          docker run --rm --init --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --user 1000:1000 --pids-limit 256 --memory 1536m --cpus 2 --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,mode=1777,size=192m \
            --mount "type=bind,src=$PWD/apps/browser-worker/test-real,dst=/opt/browser-worker/test-real,readonly" \
            --entrypoint node deva-browser-worker:verify /opt/browser-worker/test-real/engine-handoff.mjs /usr/bin/chromium
