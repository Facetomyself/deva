# PR 与推到 main 时做类型检查 + 构建，挡住编不过的改动。打包与发版仍由 release.yml 负责。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一 PR 连续推送时取消上一次未跑完的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 只做类型检查和 electron-vite 构建，用不到 Electron 二进制，跳过下载以加快安装
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: node --test apps/desktop/test/node-session-storage.test.mjs apps/desktop/test/desktop-model-protocols.test.mjs apps/desktop/test/local-text-file.test.mjs

      - name: Check operator-reviewed snapshot bytes offline
        run: pnpm --filter @deva/desktop build:snapshot-check && node --test apps/desktop/test/{project-snapshot,project-documents,snapshot-check-cli}.test.mjs

      - run: pnpm build

      - run: pnpm --filter @deva/desktop build:headless && node --test apps/desktop/test/{headless-chat,project-docs-mount}.test.mjs

      - name: Check manifest isolation and qualification guards
        run: node --test apps/desktop/test/{headless-compose-default,compose-acceptance-host,compose-acceptance-evidence,compose-acceptance-lifecycle,native-compose-entry}.test.mjs

      - name: Qualify the native amd64 Compose image and verify cleanup
        timeout-minutes: 20
        shell: bash
        run: node apps/desktop/test/verify-native-compose.mjs | tee "$RUNNER_TEMP/deva-native-amd64.json"

      - name: Save the successful native image receipt
        uses: actions/upload-artifact@v4
        with:
          name: deva-native-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deva-native-amd64.json
          if-no-files-found: error
          retention-days: 14
